<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marylelin Lelinsky — Autora &amp; Ilustradora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--night:#3b2626;--plum:#3d212b;--paper:#f4e8d6;--gold:#8c6b4a;--muted:#5a3e3e}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--night);background-image:url('assets/css/fundo-fantasia.png');background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:fixed;min-height:100vh;overflow-x:hidden}
    .wrap{width:min(1180px,calc(100% - 48px));margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;padding:2.2rem 0;flex-wrap:wrap;gap:1.5rem}
    .brand{display:flex;flex-direction:column;text-decoration:none}.brand-name{font-size:2rem;line-height:.95;font-weight:500;color:var(--night)}.brand-sub{font-family:Montserrat,sans-serif;font-size:.62rem;letter-spacing:.25em;margin-top:.45rem;color:var(--muted)}
    nav{display:flex;align-items:center;gap:.9rem;font-family:Montserrat,sans-serif;font-size:.72rem;letter-spacing:.2em}nav a{text-decoration:none;color:var(--night);transition:opacity .3s}nav a:hover{opacity:.6}nav .star{font-size:.6rem;color:var(--gold)}.nav-line{display:inline-block;width:45px;height:1px;background:rgba(59,38,38,.35)}
    .hero{padding:4rem 0 7rem;min-height:70vh;display:flex;align-items:center}.hero-content{max-width:460px;background:radial-gradient(circle,rgba(244,232,216,.9) 0%,rgba(244,232,216,.5) 75%,transparent 100%);padding:2.5rem;border-radius:16px}.hero-content h1{font-size:clamp(2.5rem,4.5vw,3.5rem);font-weight:400;line-height:1.12;color:var(--night);margin-bottom:1.2rem}.hero-content h1 em{font-style:italic;color:#6e3545}
    .divider{display:flex;align-items:center;gap:.6rem;margin:1rem 0 1.3rem;max-width:180px}.divider .line{flex:1;height:1px;background:var(--gold);opacity:.6}.divider .star{font-size:.75rem;color:var(--gold)}.subtitle{font-style:italic;font-size:1.25rem;line-height:1.5;color:var(--muted);margin-bottom:2rem}
    .btn-explorar{display:inline-flex;align-items:center;gap:.7rem;padding:.75rem 1.8rem;border:1px solid var(--night);border-radius:50px;text-decoration:none;font-family:Montserrat,sans-serif;font-size:.72rem;letter-spacing:.22em;color:var(--night);background:rgba(244,232,214,.6);transition:all .3s}.btn-explorar:hover{background:var(--plum);color:var(--paper);border-color:var(--plum)}
    .content-section{padding:5rem 0;display:flex;justify-content:flex-end}.card-quote{background:var(--plum);color:var(--paper);padding:2.5rem 2.2rem;border-radius:12px;text-align:center;max-width:300px;box-shadow:0 12px 30px rgba(30,15,20,.25)}.card-quote p{font-size:1.45rem;line-height:1.4;font-weight:400}.divider.light{margin:1.2rem auto 0;max-width:140px}.divider.light .line,.divider.light .star{background-color:var(--paper);color:var(--paper)}
    @media(max-width:768px){body{background-attachment:scroll;background-position:65% top}header{flex-direction:column;text-align:center}.nav-line{display:none}.hero-content{background:rgba(244,232,216,.92);text-align:center;margin:0 auto}.divider{margin-left:auto;margin-right:auto}.content-section{justify-content:center}nav{flex-wrap:wrap;justify-content:center}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="#top" class="brand"><span class="brand-name">Marylelin Lelinsky</span><span class="brand-sub">AUTORA ✦ ILUSTRADORA</span></a>
      <nav aria-label="Navegação principal"><span class="nav-line"></span><a href="#livros">LIVROS</a><span class="star">✦</span><a href="#atelier">ATELIER</a><span class="star">✦</span><a href="#caderno">CADERNO</a><span class="star">✦</span><a href="#sobre">SOBRE</a><span class="star">✦</span><a href="#contacto">CONTACTO</a><span class="nav-line"></span></nav>
    </header>
  </div>
  <main class="wrap" id="top">
    <section class="hero"><div class="hero-content"><h1>Entre livros,<br>imagens e mundos<br><em>possíveis.</em></h1><div class="divider"><span class="line"></span><span class="star">✦</span><span class="line"></span></div><p class="subtitle">Bem-vinda ao meu universo,<br>onde a imaginação encontra<br>novos caminhos.</p><a href="#livros" class="btn-explorar">EXPLORAR <span>✦</span></a></div></section>
  </main>
  <div class="wrap"><section id="livros" class="content-section"><div class="card-quote"><p>Há sempre<br>outra história<br>por começar.</p><div class="divider light"><span class="line"></span><span class="star">✦</span><span class="line"></span></div></div></section></div>
</body>
</html>
