  <style>
    :root {
      --bg: #F4EFE6;
      --paper: #FCF9F2;
      --ink: #2B1F24; /* Escurecido para melhor contraste */
      --muted: #6B5760;
      --rosa-velho: #D6B5B8;
      --rosa-soft: #F1E5E7;
      --rosa-text: #8C5963;
      --terracota: #B87368;
      --terracota-text: #965349;
      --line: #DFD2C7;
      --dark-bg: #3a2a35; /* Fundo escuro do quadrado da citação */
      --shadow: 0 12px 35px rgba(59, 46, 53, 0.08);
      --shadow-lg: 0 20px 50px rgba(59, 46, 53, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; scroll-padding-top: 5rem; }

    body {
      font-family: "Newsreader", Georgia, serif;
      font-size: 18px;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.75;
      overflow-x: hidden;
    }

    /* Textura de fundo sutil */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(800px 500px at 90% -10%, rgba(214, 181, 184, .3), transparent 70%),
        radial-gradient(700px 500px at -10% 30%, rgba(184, 193, 180, .25), transparent 70%),
        radial-gradient(700px 500px at 100% 90%, rgba(184, 115, 104, .12), transparent 70%);
    }

    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      opacity: .28; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .23  0 0 0 0 .18  0 0 0 0 .20  0 0 0 .4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    img { max-width: 100%; display: block; }
    a { color: var(--terracota-text); text-decoration: none; }
    a:hover { color: var(--rosa-text); }

    :focus-visible { outline: 2px solid var(--terracota-text); outline-offset: 3px; border-radius: 6px; }

    .skip {
      position: absolute; left: -999px; top: 0; z-index: 200;
      background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: 0 0 12px 0;
    }
    .skip:focus { left: 0; }

    .wrap { width: min(1120px, calc(100% - 2.5rem)); margin-inline: auto; position: relative; z-index: 1; }

    /* ---------- HEADER ESTILO BRAND KIT ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(244, 239, 230, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .site-header .wrap {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem; padding-block: 1rem;
    }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500; font-size: 1.4rem; color: var(--ink);
      text-decoration: none; display: flex; flex-direction: column; align-items: center; line-height: 1;
    }
    .brand span {
      font-family: "Newsreader", Georgia, serif;
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 4px;
    }

    .site-nav { display: flex; gap: 1.5rem; align-items: center; overflow-x: auto; scrollbar-width: none; }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      color: var(--muted); font-weight: 500; font-size: .85rem;
      letter-spacing: .15em; text-transform: uppercase;
      padding: .3rem 0; transition: color .2s; white-space: nowrap; display: flex; align-items: center; gap: 0.5rem;
    }
    .site-nav a::after { content: "✦"; font-size: 0.6rem; color: var(--rosa-velho); opacity: 0.5; }
    .site-nav a:last-child::after { display: none; }
    .site-nav a:hover { color: var(--ink); }

    /* ---------- HERO INSPIRADO NA IMAGEM ---------- */
    .hero {
      padding-top: 3rem; padding-bottom: 5rem;
    }
    
    .hero-grid {
      display: grid; 
      grid-template-columns: 1fr 1.3fr; 
      gap: 2rem; 
      align-items: stretch;
    }

    /* Lado Esquerdo: Texto */
    .hero-content {
      background: var(--bg);
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    
    .hero-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.8rem, 5vw, 4.2rem);
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 1.5rem;
      font-weight: 400;
    }
    
    .hero-divider {
      width: 40px; height: 1px; background: var(--line); margin: 1.5rem 0;
      position: relative;
    }
    .hero-divider::after {
      content: "✦"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: var(--rosa-velho); font-size: 0.8rem; background: var(--bg); padding: 0 5px;
    }

    .hero-desc {
      color: var(--muted);
      font-size: 1.1rem;
      font-style: italic;
      margin-bottom: 2.5rem;
      max-width: 350px;
    }

    .btn-outline {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .6rem 1.8rem; border-radius: 999px;
      font-family: "Newsreader", Georgia, serif;
      font-weight: 500; font-size: .95rem; cursor: pointer;
      border: 1px solid var(--muted);
      color: var(--ink);
      background: transparent;
      transition: all .2s;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .btn-outline:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    /* Lado Direito: Ilustração (Placeholder) */
    .hero-visual {
      background: linear-gradient(135deg, #e6d5cc, #d4c3b8); /* Placeholder para a imagem */
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      min-height: 500px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 2rem;
      /* Para colocar a sua imagem real, descomente a linha abaixo e coloque o caminho */
      /* background-image: url('caminho-para-sua-ilustracao.jpg'); background-size: cover; background-position: center; */
    }
    
    /* Texto falso na imagem para simular o cenário */
    .hero-visual::before {
        content: hero.png ; 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: rgba(0,0,0,0.2); font-style: italic; text-align: center; width: 80%;
    }

    /* Caixa Escura com Citação (Canto inferior direito) */
    .quote-box {
      background: var(--dark-bg);
      color: #E6D5CC;
      padding: 2.5rem;
      width: 280px;
      text-align: center;
      position: relative;
      z-index: 2;
      box-shadow: -10px -10px 20px rgba(0,0,0,0.05);
    }
    
    .quote-box p {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.4rem;
      font-style: italic;
      line-height: 1.3;
      margin-bottom: 1rem;
    }
    
    .quote-box .divider-small {
      width: 30px; height: 1px; background: rgba(230, 213, 204, 0.3); margin: 0 auto 1rem;
    }
    
    .quote-box .icon-libelinula {
      font-size: 1.5rem; opacity: 0.8;
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-content { padding: 2rem 1rem; text-align: center; align-items: center; }
      .hero-desc { margin-inline: auto; }
      .site-nav { display: none; }
      .hero-visual { min-height: 400px; justify-content: center; align-items: center; }
      .quote-box { width: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>

      </nav>

  <!-- HERO SECTION -->
  <main id="conteudo">
    <section class="hero">
      <div class="wrap">
        <div class="hero-grid">
          
          <!-- Bloco Esquerdo: Texto -->
          <div class="hero-content">
            <h1 class="hero-title">Entre livros,<br>imagens e mundos<br>possíveis.</h1>
            <div class="hero-divider"></div>
            <p class="hero-desc">
              Bem-vinda ao meu universo, onde a imaginação encontra novos caminhos.
            </p>
            <a href="#livros" class="btn-outline">
              Explorar ✦
            </a>
          </div>

          <!-- Bloco Direito: Imagem e Citação -->
          <div class="hero-visual">
            <!-- Caixa Escura com Citação (sobreposta à imagem) -->
            <div class="quote-box">
              <p>Há sempre outra história por começar.</p>
              <div class="divider-small"></div>
              <div class="icon-libelinula">🦋</div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>
