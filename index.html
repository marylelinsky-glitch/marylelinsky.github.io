<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marylelin Lelinsky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cormorant Garamond', serif;
    min-height:100vh;

    background-image:url("images/hero.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    color:#4d3441;
}

/* camada suave para ajudar a ler o texto */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,245,235,0.08);
    pointer-events:none;
}

/* LOGO */

.logo{
    position:absolute;
    top:35px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.logo h1{
    font-size:clamp(2.8rem,6vw,5rem);
    line-height:0.9;
    font-weight:400;
}

.logo p{
    margin-top:12px;
    letter-spacing:4px;
    font-size:0.95rem;
}

/* MENU */

.menu{
    position:absolute;
    top:60px;
    right:60px;

    display:flex;
    gap:30px;
}

.menu a{
    text-decoration:none;
    color:#4d3441;
    font-size:1.2rem;
    font-weight:600;
}

/* TEXTO */

.hero-texto{

    position:absolute;

    top:34%;
    right:11%;

    text-align:center;
    max-width:420px;
}

.hero-texto h2{
    font-size:clamp(2rem,4vw,4rem);
    line-height:1.2;
    font-weight:400;
}

.botao{

    display:inline-block;

    margin-top:30px;

    padding:14px 40px;

    text-decoration:none;

    color:#4d3441;

    border:1px solid #7a605b;
    border-radius:50px;

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(4px);
}

/* CARTÃO */

.cartao{

    position:absolute;

    bottom:60px;
    right:70px;

    background:rgba(73,36,60,.85);

    color:#f7e7da;

    padding:35px;

    border-radius:20px;

    max-width:260px;

    text-align:center;
}

.cartao p{
    font-size:2rem;
    line-height:1.2;
}

/* MOBILE */

@media(max-width:900px){

.menu{
    position:relative;

    top:auto;
    right:auto;

    justify-content:center;
    flex-wrap:wrap;

    padding-top:180px;
}

.logo{
    width:100%;
}

.hero-texto{

    position:relative;

    top:auto;
    right:auto;

    margin:50px auto;

    padding:20px;

    background:rgba(255,255,255,.45);

    border-radius:15px;

    width:90%;
}

.cartao{

    position:relative;

    right:auto;
    bottom:auto;

    margin:30px auto 60px;
}

}

</style>
</head>

<body>

<div class="logo">
    <h1>Marylelin<br>Lelinsky</h1>
    <p>AUTORA ✦ ILUSTRADORA</p>
</div>

<nav class="menu">
    <a href="#livros">Livros</a>
    <a href="#atelier">Atelier</a>
    <a href="#caderno">Caderno</a>
    <a href="#sobre">Sobre</a>
    <a href="#contacto">Contacto</a>
</nav>

<div class="hero-texto">
    <h2>
        Entre livros,<br>
        imagens e mundos<br>
        possíveis.
    </h2>

    <a href="#livros" class="botao">
        EXPLORAR
    </a>
</div>

<div class="cartao">
    <p>
        Há sempre<br>
        outra história<br>
        por começar.
    </p>
</div>

</body>
</html>
