<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marylelin Lelinsky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:'Cormorant Garamond',serif;
}

.landing{

    width:100vw;
    height:100vh;

    background:url("images/hero.png") center center;
    background-size:cover;
    background-repeat:no-repeat;

    position:relative;
}

/* LOGO */

.logo{

    position:absolute;

    top:5%;
    left:10%;

    text-align:center;
}

.logo h1{

    font-size:5.5rem;

    line-height:.88;

    font-weight:400;

    color:#4f3139;
}

.logo p{

    margin-top:15px;

    letter-spacing:6px;

    font-size:1rem;

    color:#624a52;
}

/* MENU */

.menu{

    position:absolute;

    top:8%;

    right:8%;

    display:flex;

    gap:35px;
}

.menu a{

    text-decoration:none;

    color:#60474b;

    font-size:1rem;

    letter-spacing:2px;
}

.menu a:hover{

    opacity:.7;
}

/* FRASE */

.frase{

    position:absolute;

    top:33%;

    right:14%;

    text-align:center;
}

.frase h2{

    font-size:4rem;

    font-style:italic;

    font-weight:300;

    line-height:1.4;

    color:#7e5c6b;
}

/* BOTÃO */

.botao{

    display:inline-block;

    margin-top:30px;

    text-decoration:none;

    color:#60474b;

    border:1px solid #9e826b;

    border-radius:50px;

    padding:16px 50px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(3px);
}

/* LIVROS */

.livros{

    position:absolute;

    left:7%;

    bottom:5%;

    display:flex;

    gap:35px;
}

.livros img{

    width:180px;

    border-radius:4px;

    box-shadow:
    0 15px 35px rgba(0,0,0,.20);

    transition:.4s;
}

.livros img:hover{

    transform:translateY(-10px);
}

/* FRASE FINAL */

.cartao{

    position:absolute;

    right:6%;
    bottom:6%;

    width:270px;
    height:270px;

    background:#653852;

    border-radius:30px;

    display:flex;

    justify-content:center;
    align-items:center;

    box-shadow:
    0 15px 35px rgba(0,0,0,.25);
}

.cartao p{

    color:white;

    text-align:center;

    font-size:2rem;

    line-height:1.5;
}

/* MOBILE */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .landing{
        min-height:100vh;
        height:auto;
    }

    .logo{

        position:relative;

        top:auto;
        left:auto;

        text-align:center;

        padding-top:40px;
    }

    .logo h1{

        font-size:3rem;
    }

    .menu{

        position:relative;

        top:auto;
        right:auto;

        margin-top:25px;

        justify-content:center;

        flex-wrap:wrap;
    }

    .frase{

        position:relative;

        top:auto;
        right:auto;

        text-align:center;

        margin-top:60px;
    }

    .frase h2{

        font-size:2.4rem;
    }

    .livros{

        position:relative;

        left:auto;
        bottom:auto;

        justify-content:center;

        flex-wrap:wrap;

        padding:50px 20px;
    }

    .livros img{

        width:130px;
    }

    .cartao{

        position:relative;

        right:auto;
        bottom:auto;

        margin:40px auto;
    }

}

</style>
</head>

<body>

<div class="landing">

    <div class="logo">

        <h1>
            Marylelin<br>
            Lelinsky
        </h1>

        <p>
            AUTORA ✦ ILUSTRADORA
        </p>

    </div>

    <div class="menu">

        <a href="#">LIVROS</a>

        <a href="#">ATELIER</a>

        <a href="#">CADERNO</a>

        <a href="#">SOBRE</a>

        <a href="#">CONTACTO</a>

    </div>

    <div class="frase">

        <h2>
            Entre livros,<br>
            imagens e mundos<br>
            possíveis.
        </h2>

        <a class="botao" href="#">
            EXPLORAR
        </a>

    </div>

    <div class="livros">

        <img src="images/saudade-flor.jpg" alt="Saudade é Nome de Flor">

        <img src="images/bota-melancias.jpg" alt="O Que Faz Uma Bota no Céu das Melancias">

        <img src="images/sonho-dos-mortos.jpg" alt="O Sonho dos Mortos">

        <img src="images/luzes-da-chuva.jpg" alt="As Luzes da Chuva">

    </div>

    <div class="cartao">

        <p>
            Há sempre<br>
            outra história<br>
            por começar.
        </p>

    </div>

</div>

</body>
</html>
