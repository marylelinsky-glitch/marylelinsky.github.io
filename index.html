  <style>
    :root {
      /* Paleta inspirada na imagem brand kit (Pergaminho, Rosa Velho, Pérola, Castanho Sépia Antigo) */
      --bg: #F4EFE6;            /* Fundo tom pergaminho antigo / marfim */
      --paper: #FCF9F2;         /* Branco pérola dos cartões */
      --ink: #3B2E35;           /* Castanho-vinho escuro literário para texto */
      --muted: #6B5760;         /* Tom secundário suave */

      --rosa-velho: #D6B5B8;    /* Rosa velho poeirento */
      --rosa-soft: #F1E5E7;     /* Rosa claro de fundo */
      --rosa-text: #8C5963;     /* Tom de destaque para rótulos e títulos */

      --terracota: #B87368;     /* Terracota suave / Acento */
      --terracota-text: #965349;
      
      --line: #DFD2C7;          /* Linha de caderno/perfil */
      --radius: 20px;
      --shadow: 0 12px 35px rgba(59, 46, 53, 0.08);
      --shadow-lg: 0 20px 50px rgba(59, 46, 53, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; scroll-padding-top: 5rem; }

    body {
      font-family: "Newsreader", Georgia, serif;
      font-size: 18px;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.75;
      overflow-x: hidden;
    }

    /* Textura de papel envelhecido / vinhetas suaves */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(800px 500px at 90% -10%, rgba(214, 181, 184, .3), transparent 70%),
        radial-gradient(700px 500px at -10% 30%, rgba(184, 193, 180, .25), transparent 70%),
        radial-gradient(700px 500px at 100% 90%, rgba(184, 115, 104, .12), transparent 70%);
    }

    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      opacity: .28; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .23  0 0 0 0 .18  0 0 0 0 .20  0 0 0 .4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    img { max-width: 100%; display: block; }
    a { color: var(--terracota-text); text-decoration: none; }
    a:hover { color: var(--rosa-text); }

    :focus-visible { outline: 2px solid var(--terracota-text); outline-offset: 3px; border-radius: 6px; }

    .skip {
      position: absolute; left: -999px; top: 0; z-index: 200;
      background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: 0 0 12px 0;
    }
    .skip:focus { left: 0; }

    .wrap { width: min(1120px, calc(100% - 2.5rem)); margin-inline: auto; position: relative; z-index: 1; }

    section { padding: 5.5rem 0; position: relative; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-10px) rotate(4deg); }
    }

    /* ---------- HEADER ESTILO BRAND KIT ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(244, 239, 230, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .site-header .wrap {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem; padding-block: 1rem;
    }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600; font-size: 1.5rem; color: var(--ink);
      text-decoration: none; display: flex; align-items: center; gap: .6rem;
    }
    .brand svg { width: 32px; height: 32px; }

    .site-nav { display: flex; gap: 1.6rem; align-items: center; overflow-x: auto; scrollbar-width: none; }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      color: var(--muted); font-weight: 500; font-size: .95rem;
      letter-spacing: .08em; text-transform: uppercase;
      padding: .3rem 0; border-bottom: 1px solid transparent;
      transition: color .2s, border-color .2s; white-space: nowrap;
    }
    .site-nav a:hover { color: var(--rosa-text); border-color: var(--rosa-velho); }

    /* ---------- BOTÕES ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .8rem 1.8rem; border-radius: 999px;
      font-family: "Newsreader", Georgia, serif;
      font-weight: 500; font-size: 1.02rem; cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform .2s, background .2s, border-color .2s, color .2s;
      box-shadow: 0 4px 15px rgba(59, 46, 53, .06);
    }
    .btn svg { width: 18px; height: 18px; flex: none; }
    .btn-primary { background: var(--rosa-text); color: #FFFDF9; }
    .btn-primary:hover { transform: translateY(-2px); background: var(--ink); }
    .btn-ghost { background: transparent; border-color: var(--ink); color: var(--ink); }
    .btn-ghost:hover { transform: translateY(-2px); border-color: var(--rosa-text); color: var(--rosa-text); }
    .btn-rosa { background: var(--rosa-velho); color: var(--ink); }
    .btn-rosa:hover { transform: translateY(-2px); background: #C8A3A7; }
    .btn-small { padding: .5rem 1.15rem; font-size: .95rem; }
    .btn-block { width: 100%; justify-content: center; }

    /* ---------- HERO INSPIRADO NA IMAGEM CENTRAL ---------- */
    .hero {
      padding-top: 4.5rem; padding-bottom: 4rem;
    }
    .hero-box {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: clamp(2rem, 5vw, 4.5rem);
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    /* Sutil detalhe de moldura estilo gravura antiga */
    .hero-box::before {
      content: ""; position: absolute; inset: 14px; pointer-events: none;
      border: 1px dashed rgba(107, 87, 96, 0.25);
      border-radius: 18px;
    }
    .hero-grid {
      display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 3.5rem; align-items: center;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--rosa-soft); color: var(--rosa-text);
      border: 1px solid rgba(214, 181, 184, .5);
      padding: .35rem 1.1rem; border-radius: 999px;
      font-weight: 500; font-size: .92rem; font-style: italic;
